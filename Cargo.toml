[package]
name = "aishe"
version = "0.6.5"
edition = "2021"
rust-version = "1.88"
description = "AIShe (AI Shell): natural-language-aware shell that runs real zsh for commands and an agent for everything else"
license = "MIT"
repository = "https://github.com/billiondollarsolo/aishe"
homepage = "https://github.com/billiondollarsolo/aishe"
documentation = "https://github.com/billiondollarsolo/aishe/tree/main/docs"
readme = "README.md"
keywords = ["shell", "llm", "ai", "repl", "cli"]
categories = ["command-line-utilities"]

# `cargo binstall aishe` fetches the prebuilt binary from the GitHub release
# artifacts produced by .github/workflows/release.yml (named aishe-<target>.tar.gz
# with the `aishe` binary at the archive root).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/aishe-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "aishe{ binary-ext }"

[[bin]]
name = "aishe"
path = "src/main.rs"

[features]
default = ["highlight"]
# Syntax-highlight fenced code blocks in rendered model output (adds the syntect
# dependency and the bundled syntaxes/themes). Disable for a smaller binary:
#   cargo build --release --no-default-features
highlight = ["dep:syntect"]

[dependencies]
ureq = { version = "2", features = ["json", "tls", "native-certs"] }
# The managed OpenCode loopback transport uses ureq 3's panic-free response
# body handling. TLS is intentionally omitted because this client accepts only
# private HTTP endpoints on the local host.
ureq3 = { package = "ureq", version = "3.3.0", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossterm = "0.28"
termimad = "0.31"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
thiserror = "2"
regex = "1"
dirs = "5"
libc = "0.2"
portable-pty = "0.9"
base64 = "0.22"
flate2 = "1"
fs2 = "0.4"
rand = "0.9"
sha2 = "0.10"
tar = "0.4"
tiny_http = "0.12"
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
# Pure-Rust regex engine (fancy-regex) so no C oniguruma dependency is needed.
# Only the embedded default syntax/theme dumps are loaded at runtime. Excluding
# plist-load and yaml-load removes unnecessary untrusted document parsers from
# the production dependency graph.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
], optional = true }

[dev-dependencies]
assert_cmd = "2"
mockito = "1"
predicates = "3"

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
