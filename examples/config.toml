# Example aishe configuration.
#
# Copy this to `config.toml` in aishe's config directory and edit to taste:
#   Linux:  ~/.config/aishe/config.toml  (or $XDG_CONFIG_HOME/aishe/config.toml)
#   macOS:  ~/Library/Application Support/aishe/config.toml
# aishe follows each platform's own convention, so a config left in ~/.config on
# macOS is silently ignored. Run `aishe doctor` to print the path actually in use,
# or set AISHE_CONFIG_DIR (and AISHE_DATA_DIR) to choose your own. See
# docs/configuration.md#file-locations.
#
# Every field has a sensible default, so you can delete any line you do not care
# about. API keys are NEVER stored here. Named connections bind a provider,
# endpoint, model, and explicit auth method; secret values stay in private stores.

version = 6

[aishe]
# Named setup bundle: conservative | balanced | autonomous | custom. Applying a
# profile prints every setting it changes; hand edits make it custom.
safety_profile = "custom"

# Interaction mode for natural-language input.
#   suggest = propose a command, you confirm  (default)
#   auto    = run safe commands immediately, confirm dangerous ones
#   yolo    = agentic loop that runs commands and iterates until done
mode = "suggest"

# Durable default connection. `/model` changes only the current shell unless
# you press `d` or pass `--default`.
connection = "anthropic"
connection_fallback = "anthropic"

# Optional native-compatibility fallback chain. Managed OpenCode turns never
# start a second provider request after prompt admission, partial output, or a
# tool effect; interrupted managed turns remain resumable instead.
# provider_fallback = ["openai"]

# In the zsh-PTY front-end, show aishe's branded prompt (`<cwd> <glyph>`, with the
# glyph reflecting the mode: ❯ suggest, » auto, * yolo) instead of your normal zsh
# prompt, so it's obvious you're in aishe. This OVERRIDES your real prompt, so any
# git/branch/dirty segments from powerlevel10k & friends are hidden while in aishe.
# Set false to keep your own prompt (recommended for p10k users, whose instant- and
# transient-prompt can otherwise conflict). Everything else — autosuggestions,
# syntax highlighting, completions, fzf-tab, oh-my-zsh — is inherited natively
# regardless; only the prompt is overridden.
pty_prompt = true

# Deprecated native-backend compatibility settings. Managed yolo asks once for
# workspace/host scope in each new shell, then does not prompt per action.
yolo_confirm_dangerous = true

# When the yolo loop pauses to confirm a command:
#   never     = run everything
#   dangerous = only safety-gate-flagged commands  (default)
#   writes    = also any state-modifying command
#   all       = every command
yolo_confirm = "dangerous"

# Sandbox the yolo loop's commands. Toggle live by typing `sandbox on` at the
# aishe prompt (a prompt-only meta command, not an `aishe` subcommand).
yolo_sandbox = false

# How yolo_sandbox is enforced:
#   policy = best-effort string gate: refuse commands that reach the network or
#            write outside the working tree (the reason is fed back to the model).
#            Default. Not a kernel sandbox — can be evaded.
#   bwrap  = real OS isolation via bubblewrap: the command runs with a read-only
#            root, only the working tree and /tmp writable, so it *physically*
#            cannot modify the system. Falls back to "policy" if bwrap isn't
#            installed. (`aishe doctor` shows which is active.)
sandbox_backend = "policy"

# Maximum tool-use iterations for a single yolo request.
max_yolo_iterations = 10

# Plan-first (dry run) for yolo: before running anything, the model lays out its
# intended steps and you approve them ("Proceed with this plan? [Y/n]"). Adds one
# planning call per request. Interactive only; off by default. Toggle live by
# typing `plan on` at the aishe prompt (a prompt-only meta command).
yolo_plan = false

# Reversible yolo session: run the whole agentic loop against a throwaway copy of
# the working tree (under bubblewrap — read-only root, no network), then show the
# cumulative file diff and apply-or-discard it at the end. Interactive runs prompt;
# non-interactive (-c) runs auto-apply (journaled, so `aishe undo` reverts). Off by
# default; needs bubblewrap (degrades to a normal run when absent).
yolo_dry_run = false

# Preview-first file edits for yolo: when the loop uses a built-in write_file or
# edit_file, show the diff and ask before applying it ("apply this write to
# <path>? [y/N]"), instead of writing first and showing the diff after. Applies
# to the file tools only; interactive only; off by default. Applied changes are
# still journaled for `aishe undo`.
yolo_preview = false

# Verbose yolo: stream every command's full output to the terminal. Off by
# default, so yolo shows a compact per-step result (the command, then exit code +
# line count, plus a short tail on failure) instead of dumping everything. The
# model always receives the full output regardless.
yolo_verbose = false

# Offer the built-in file tools (read_file / write_file / edit_file / list_dir)
# to yolo, so it edits files precisely instead of via cat/sed/heredocs.
file_tools = true

# Offer the built-in web tool (fetch_url) to yolo, so it can read pages and docs
# (HTTP GET, HTML stripped to text, size-capped) instead of curl/wget.
web_tool = true

# Semantic history search (opt-in). When on, `aishe history index` embeds your
# shell-history commands into a local vector store (history.vec) so
# `aishe history search "<query>"` can recall past commands by meaning. Off by
# default; nothing is embedded until you run `aishe history index`.
semantic_history = false
# Which provider serves embeddings (anthropic has none — use openai or a local
# Ollama block). Empty = the active provider above.
embedding_provider = ""
# Embedding model, served over an OpenAI-compatible /v1/embeddings endpoint:
# text-embedding-3-small (OpenAI) or e.g. nomic-embed-text (local Ollama).
embedding_model = "text-embedding-3-small"
# Keep the index fresh automatically: re-run the incremental `history index` when
# the interactive shell exits, so new commands are searchable without a manual
# `aishe history index`. Off by default (it embeds new commands on the embedding
# provider — free with a local Ollama, metered on a paid API). Needs
# semantic_history.
semantic_history_autoindex = false

# Give the fix-the-last-command key (Ctrl-X Ctrl-F) the failed command's actual
# error output: when on, a read-only, safe failed command is re-run once (bounded
# by a timeout) to capture its stderr, which is fed into the correction prompt for
# a better fix. Off by default; only read-only commands are ever re-run, so a
# destructive or network command is never re-executed.
fix_capture_stderr = false

# zsh AUTO_PUSHD for aishe's in-process `cd` (the `-c` and shell-hook paths):
# every `cd` pushes the previous directory onto the stack. Navigate with
# `cd -N` / `cd +N`, list with `dirs -v`.
auto_pushd = false

# Extra base directories searched by `cd <name>` (like zsh cdpath / $CDPATH).
# cdpath = ["/home/me/projects", "/srv"]

# Share one timestamped history across concurrent and future sessions. When the
# account has no zsh HISTFILE of its own, aishe uses this log as native zsh
# history and enables SHARE_HISTORY. Off makes aishe history per-session
# (pid-suffixed files). The log uses zsh EXTENDED_HISTORY format
# (`: <epoch>:0;<command>`).
share_history = true

# Output-format strategy for suggest mode.
#   schema = strict JSON schema where supported, with automatic step-down (default)
#   json   = ask for any JSON object
#   prompt = unconstrained text, parsed defensively
structured = "schema"

# Stream answers token-by-token (suggest and auto).
stream = false

# Provider reasoning effort. `auto` uses the endpoint/model default.
reasoning_effort = "auto"

# Print one concise recovery hint after a non-zero interactive command.
failure_hints = true

# Print a dim per-call token+cost line after each model interaction, and a
# one-line "aishe session: … reqs · ~$…" summary across the whole interactive
# session when you exit the zsh front-end.
show_usage = true

# Live branded-prompt status: right | below | off. Detailed fields are easier to
# read below the prompt on narrow terminals.
status_line = true
status_line_position = "right"
status_line_items = ["identity", "mode", "scope", "session_cost", "requests"]
# Other fields: connection, provider, endpoint, auth, selection, model,
# reasoning, backend, task, elapsed, context, last_tokens, last_cost,
# session_tokens.

# Stop calling the model once the estimated session cost reaches this many USD.
# 0 = unlimited. Only enforced when the model's price is known.
budget_usd = 0.0

# Remember recent natural-language turns so follow-ups
# ("now do the same for the other file") have context. Clear by typing `reset` at
# the aishe prompt (a prompt-only meta command).
memory = true

# Cache identical suggest-mode model responses for a short while so repeats are
# instant and cost no tokens. The cache key includes the environment context
# (cwd, recent commands), so running something between two requests misses it.
# Toggle live by typing `cache on`/`off` at the aishe prompt (a prompt-only meta
# command).
cache = true
cache_ttl_secs = 300

# Scrub likely secrets (tokens, passwords, URL credentials) from the environment
# context block sent to the model. Recommended on.
redact_secrets = true

# Include a per-project .aishe/context.md (found at or above the cwd) in the model
# context, so repo-specific conventions reach the model. Capped at 4000 chars.
project_context = true

# Include this repo's task surface (justfile/Makefile targets, package.json &
# composer scripts, compose services, Cargo/Python markers, CI) in the context, so
# "run the tests" maps to the project's real command. Walks up to the repo root,
# so it still resolves from a subdirectory. Cheap (cached file reads).
project_tasks = true

# Include a one-line list of tools installed on $PATH (package manager, container
# runtime, kubectl, ...) plus operational host facts (init system; the active
# Kubernetes context) so the model proposes commands that fit this host. Cheap
# (cached `which` + local config reads). See `aishe context` to preview the block.
host_profile = true

# Optional context sections to suppress before each model request. Inspect the
# available section IDs and token estimates with `aishe context --explain`.
# context_exclude = ["git", "host_profile"]

# A repo can also ship a project-local config overlay at .aishe/config.toml
# (discovered like .aishe/context.md) that is merged over this file. Safe keys
# (model, mode, budget, cosmetics) apply automatically; sensitive keys (provider/
# endpoint, [mcp_servers], logging, safety toggles, mode = "yolo") apply only
# after you run `aishe trust` in that repo. A project skill or `shell: true`
# command is trusted per file: `aishe trust .aishe/skills/<name>/SKILL.md`.
# See docs/project-config.md.

# ---------------------------------------------------------------------------
# Managed agent engine. Aishe owns the exact OpenCode version and hash; those
# are not editable config. The backend starts lazily only for AI turns.
# ---------------------------------------------------------------------------

[backend]
engine = "opencode"             # native is a temporary repair/legacy override
fallback = "native"             # allowed only before OpenCode admits a prompt
managed = true
idle_timeout_secs = 1800
default_scope = "workspace"     # workspace | host; yolo acceptance is not saved
workspace_network = "deny"      # allow | deny
output = "focus"                # focus | compact | detailed
max_output_tokens = 0           # 0 = backend/model default
max_instances = 8               # isolated provider runtimes, bounded 1..32

[sandbox]
linux_backend = "bwrap"         # bwrap | policy
require_functional = false      # true = fail rather than policy-degrade
workspace_roots = []
allow_host_yolo = true

# ---------------------------------------------------------------------------
# Optional: audit logging of AI calls, responses, and AI-initiated actions.
# Off by default (it writes prompts/outputs to disk). Also enableable with
# AISHE_LOG=1, and the path with AISHE_LOG_FILE.
# ---------------------------------------------------------------------------

# [logging]
# enabled = true
# file = "/custom/path/audit.jsonl"   # default: audit.jsonl in aishe's data dir
#                                     # (~/.local/share/aishe on Linux,
#                                     #  ~/Library/Application Support/aishe on macOS)
# redact = true                       # scrub secrets from logged text

# ---------------------------------------------------------------------------
# Named connections. Multiple entries may use the same provider with different
# API-key profiles or isolated OAuth profiles. `/model` switches them together.
# ---------------------------------------------------------------------------

[connections.anthropic]
provider = "anthropic"
label = "Anthropic"
base_url = "https://api.anthropic.com"
model = "claude-sonnet-4-20250514"
transport = "auto"
auth_required = true
[connections.anthropic.auth]
type = "api_key"
credential = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[connections.openai-work]
provider = "openai"
label = "OpenAI work"
# Point base_url at any OpenAI-compatible endpoint:
#   OpenAI:     https://api.openai.com
#   Groq:       https://api.groq.com/openai
#   Ollama:     http://localhost:11434
#   OpenRouter: https://openrouter.ai/api
base_url = "https://api.openai.com"
model = "gpt-5.6-luna"
transport = "auto"    # official OpenAI => Responses; custom endpoints => Chat
auth_required = true  # set false for a local Ollama; no dummy key is required
[connections.openai-work.auth]
type = "oauth"
profile = "work"

# A second OpenAI connection can use a separate API project at the same time.
[connections.openai-api]
provider = "openai"
label = "OpenAI API key"
base_url = "https://api.openai.com"
model = "gpt-5.6-luna"
transport = "responses"
[connections.openai-api.auth]
type = "api_key"
credential = "openai-team"
api_key_env = "OPENAI_API_KEY"

# ---------------------------------------------------------------------------
# Optional: MCP (Model Context Protocol) servers. Their tools are offered to the
# yolo agentic loop, namespaced mcp__<name>__<tool>. Any stdio MCP server works
# (npx, uvx, a binary, ...). See docs/mcp.md. List connected tools with `aishe mcp`.
# ---------------------------------------------------------------------------

# [mcp_servers.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/me/projects"]

# [mcp_servers.git]
# command = "uvx"
# args = ["mcp-server-git", "--repository", "/home/me/projects/aishe"]
# env = { GIT_PAGER = "cat" }
# enabled = true

# An HTTP (Streamable HTTP) MCP server uses `url` instead of `command`:
# [mcp_servers.remote]
# url = "https://mcp.example.com/mcp"
# headers = { Authorization = "Bearer ..." }

# ---------------------------------------------------------------------------
# Optional: per-model price overrides for cost estimates (USD per 1M tokens).
# Prefer an exact model key (or `aishe price set ...`). Legacy substring keys and
# then the built-in table are fallbacks. Setup asks when a model is unpriced.
# ---------------------------------------------------------------------------

# [pricing."openai/gpt-oss-120b"]
# input = 0.15
# output = 0.60

# ---------------------------------------------------------------------------
# Optional: named directories for `~name` expansion in cd (zsh hashed dirs).
# Then `cd ~proj` and `cd ~proj/app` work.
# ---------------------------------------------------------------------------

# [named_dirs]
# proj = "/home/me/projects"
# dl = "/home/me/Downloads"
