# Aishe dependency and supply-chain policy.
#
# CI evaluates this file with cargo-deny 0.19.x. Keep exceptions narrowly
# scoped and document the reason beside every exception that is added.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Owner: maintainers · Added: 2026-07-31 · Review by: 2026-10-31
    # Target removal: replace the embedded dump decoder or upgrade when syntect
    # removes the affected bincode path.
    # syntect uses bincode only to decode its own compile-time embedded,
    # version-matched syntax/theme assets. No user-controlled bytes reach it,
    # and syntect 5.3.0 has no maintained dump decoder alternative.
    { id = "RUSTSEC-2025-0141", reason = "trusted embedded syntect assets only; no untrusted deserialization path" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
