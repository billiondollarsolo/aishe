# nfpm config for building aishe .deb and .rpm packages.
# https://nfpm.goreleaser.com
#
# Driven by the release workflow (.github/workflows/release.yml), which sets the
# templated environment variables and runs, per arch and packager:
#
#   VERSION=0.1.5 ARCH=amd64 BINARY=dist/amd64/aishe \
#     nfpm package --config nfpm.yaml --packager deb --target dist/
#
# It expects the shell completions and man page to have been generated into
# dist/completions/ and dist/man/ first (see the workflow). You can also build
# locally the same way once those files exist.
name: aishe
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: "billiondollarsolo <billiondollarsolo@users.noreply.github.com>"
description: |
  Native zsh command line with a managed coding-agent backend. Aishe preserves
  ordinary shell behavior while routing natural language through a private,
  compatibility-pinned OpenCode runtime installed and verified during setup.
vendor: billiondollarsolo
homepage: https://github.com/billiondollarsolo/aishe
license: MIT

# These are weak dependencies: restricted containers can use the bash hook and
# policy-only degradation. Setup explains the limitation, obtains consent before
# package installation, and functionally verifies bubblewrap when selected.
recommends:
  - zsh
  - bubblewrap

contents:
  - src: ${BINARY}
    dst: /usr/bin/aishe
    file_info:
      mode: 0755

  - src: dist/completions/aishe.bash
    dst: /usr/share/bash-completion/completions/aishe
  - src: dist/completions/_aishe
    dst: /usr/share/zsh/site-functions/_aishe
  - src: dist/completions/aishe.fish
    dst: /usr/share/fish/vendor_completions.d/aishe.fish

  - src: dist/man/aishe.1.gz
    dst: /usr/share/man/man1/aishe.1.gz

  - src: LICENSE
    dst: /usr/share/doc/aishe/LICENSE
  - src: README.md
    dst: /usr/share/doc/aishe/README.md
  - src: CHANGELOG.md
    dst: /usr/share/doc/aishe/CHANGELOG.md
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/aishe/THIRD_PARTY_NOTICES.md
  - src: assets/backend/opencode/LICENSE
    dst: /usr/share/doc/aishe/OpenCode-LICENSE

deb:
  compression: zstd
rpm:
  compression: zstd:default
