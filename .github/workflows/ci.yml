name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: documentation lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require lifecycle labels and index entries
        shell: bash
        run: |
          failed=0
          for document in docs/design/*.md; do
            if ! head -n 30 "$document" | grep -Eq '^> \*\*Lifecycle: (Active|Implemented|Superseded|Historical|Validation evidence)\.\*\*'; then
              echo "Missing recognized lifecycle label: $document" >&2
              failed=1
            fi

            filename="${document##*/}"
            if ! grep -Fq "[$filename]($filename)" docs/design/README.md; then
              echo "Missing from docs/design/README.md: $document" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Check internal documentation links and anchors
        run: python3 tests/docs_contract_test.py

  supply-chain:
    name: dependency advisories, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Isolate the managed runtime
        shell: bash
        run: echo "AISHE_RUNTIME_DIR=$RUNNER_TEMP/aishe-runtime" >> "$GITHUB_ENV"

      # aishe wraps a real zsh, so `aishe doctor` reports a failed check and
      # exits non-zero without it. macOS runners ship zsh; ubuntu does not, so
      # the cli tests that assert `doctor` succeeds failed only there.
      - name: Install zsh (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh bubblewrap shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --verbose --locked

      - name: Shellcheck and generated hook syntax
        run: python3 tests/shell_contract.py target/debug/aishe

      - name: Install and live-verify pinned OpenCode runtime
        run: |
          target/debug/aishe backend install
          target/debug/aishe backend verify --live

      - name: Test
        run: cargo test --all-targets --verbose --locked

      - name: Installer transaction and fault contract
        run: sh tests/installer_runtime_transaction.sh

  msrv:
    name: MSRV (1.88) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.88 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.88
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
      - name: Build on 1.88
        run: cargo build --verbose --locked

  pty-smoke:
    name: PTY smoke tests (zsh-pty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Isolate the managed runtime
        shell: bash
        run: echo "AISHE_RUNTIME_DIR=$RUNNER_TEMP/aishe-runtime" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install zsh
        run: |
          sudo apt-get update && sudo apt-get install -y zsh bubblewrap tmux screen
          # GitHub images leave the zsh completion directories group-writable,
          # so compinit stops with an interactive "insecure directories …
          # continue [y] or abort [n]?" prompt. Inside a PTY test that prompt
          # eats a keystroke and every later expect() reads a line behind.
          # ZSH_DISABLE_COMPFIX does not help — it is an oh-my-zsh variable,
          # not something native compinit consults.
          sudo chmod -R go-w /usr/share/zsh /usr/local/share/zsh 2>/dev/null || true
          zsh -f -c 'autoload -Uz compaudit && compaudit' || echo "compaudit clean"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Direct shell never starts backend and stays within startup SLO
        run: >-
          python3 tests/direct_shell_benchmark.py target/release/aishe
          --commands 100 --warmup 10

      - name: Install and live-verify pinned OpenCode runtime
        run: |
          target/release/aishe backend install
          target/release/aishe backend verify --live

      - name: Installer upgrade preserves config and data
        run: sh tests/installer_upgrade.sh target/release/aishe

      - name: Generated CLI reference matches the clap tree
        run: python3 tests/docs_cli_block_test.py target/release/aishe

      - name: Unauthenticated loopback provider
        run: python3 tests/provider_unauthenticated.py target/release/aishe

      - name: Private shared credentials and precedence
        run: python3 tests/credentials_linux.py target/release/aishe

      - name: Real-model JSON/exit contract validator
        run: python3 tests/live_contract_test.py

      - name: External harness binary identity helper
        run: python3 tests/harness_identity_test.py

      - name: Native Bash 5 hook declared-tier matrix
        timeout-minutes: 5
        run: |
          python3 tests/bash_hook_test.py
          python3 tests/bash_hook.py target/release/aishe \
            --bash /bin/bash --require-family 5.x

      - name: Terminal latency, tmux, and screen compatibility contract
        timeout-minutes: 8
        run: |
          python3 tests/terminal_compat_test.py
          python3 tests/terminal_compat.py target/release/aishe \
            --capability local-latency --require-capability local-latency \
            --capability tmux --require-capability tmux \
            --capability screen --require-capability screen \
            --json test-results/terminal-compat-linux.json

      - name: Drive real zsh through the PTY front-end
        run: python3 tests/pty_smoke.py target/release/aishe

      - name: zsh-PTY scenario tests (NL routing, sigils, auto-mode, history)
        run: python3 tests/pty_scenarios.py target/release/aishe

      - name: zsh-PTY statusline placement and live metrics
        run: python3 tests/statusline_pty.py target/release/aishe

      - name: Unified connection/model picker and concurrent shell selection
        run: python3 tests/model_picker_pty.py target/release/aishe

      - name: Interactive setup state-machine PTY
        run: python3 tests/setup_pty.py target/release/aishe

      - name: In-shell regression PTY suite
        run: |
          python3 tests/in_shell_menus_pty.py target/release/aishe
          python3 tests/yolo_consent_pty.py target/release/aishe
          python3 tests/palette_pty.py target/release/aishe
          python3 tests/mode_handoff_pty.py target/release/aishe
          python3 tests/bare_words_pty.py target/release/aishe
          python3 tests/theme_prompt_pty.py target/release/aishe
          python3 tests/keys_pty.py target/release/aishe
          python3 tests/picker_arrows_pty.py target/release/aishe
          python3 tests/statusline_width_pty.py target/release/aishe

      - name: Pinned OpenCode provider and tool-bridge contract
        run: python3 tests/opencode_runtime_contract.py target/release/aishe

      - name: Same-provider connection credential and runtime isolation
        run: python3 tests/opencode_connection_isolation.py target/release/aishe

      - name: Workspace-to-host authority, focus output, and reset contract
        run: python3 tests/opencode_host_scope.py target/release/aishe

      - name: Managed OpenCode startup, reconnect, and memory qualification
        run: >-
          python3 tests/opencode_soak.py target/release/aishe
          --turns 20 --cold-cycles 3 --warm-probes 20 --reconnect-every 10

      - name: Concurrent managed-session isolation
        run: python3 tests/opencode_concurrency.py target/release/aishe --sessions 8

      - name: Durable task interruption and resume
        run: python3 tests/durable_task_resume.py target/release/aishe

      - name: zsh-PTY fuzz (generated commands, sigil NL, adversarial responses)
        run: python3 tests/pty_fuzz.py target/release/aishe

      - name: zsh feature matrix (pipes, here-docs, loops, jobs, history, ...)
        run: python3 tests/zsh_features.py target/release/aishe

      - name: zsh-PTY signals (Ctrl-C, Ctrl-Z, resize, multi-line)
        run: python3 tests/pty_signals.py target/release/aishe

      - name: Real-model classification (opt-in; skips without the secret)
        env:
          AISHE_REALTEST_KEY: ${{ secrets.AISHE_REALTEST_KEY }}
          AISHE_REALTEST_BASE_URL: https://api.openai.com
          AISHE_REALTEST_MODEL: gpt-5.6-luna
        run: python3 tests/real_model.py target/release/aishe
      - name: Real-model robustness fuzz (opt-in; skips without the secret)
        env:
          AISHE_REALTEST_KEY: ${{ secrets.AISHE_REALTEST_KEY }}
          AISHE_REALTEST_BASE_URL: https://api.openai.com
          AISHE_REALTEST_MODEL: gpt-5.6-luna
        run: python3 tests/real_fuzz.py target/release/aishe
      - name: Admin validation (shell pass-through + file ops; NL skipped w/o key)
        run: python3 tests/admin_validation.py target/release/aishe

  pty-macos:
    name: macOS flagship PTY gate (bounded)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Isolate the managed runtime
        shell: bash
        run: echo "AISHE_RUNTIME_DIR=$RUNNER_TEMP/aishe-runtime" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pty-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Build release binary
        timeout-minutes: 10
        run: cargo build --release --locked

      # These are CLI-owned pseudo-terminals. They need the runner's normal
      # PTY device access only; Accessibility, Screen Recording, Automation,
      # and Full Disk Access permissions are neither requested nor required.
      - name: Terminal latency and resize contract
        timeout-minutes: 4
        run: |
          python3 tests/terminal_compat_test.py
          python3 tests/terminal_compat.py target/release/aishe \
            --capability local-latency --require-capability local-latency \
            --json test-results/terminal-compat-macos.json

      - name: Routing, sigils, auto-mode, and history PTY
        timeout-minutes: 5
        run: python3 tests/pty_scenarios.py target/release/aishe

      - name: Connection and model picker PTY
        timeout-minutes: 5
        run: python3 tests/model_picker_pty.py target/release/aishe

      - name: Statusline placement and live metrics PTY
        timeout-minutes: 5
        run: python3 tests/statusline_pty.py target/release/aishe

      - name: Setup state-machine PTY
        timeout-minutes: 5
        run: python3 tests/setup_pty.py target/release/aishe

      - name: Signals, resize, and multi-line PTY
        timeout-minutes: 5
        run: python3 tests/pty_signals.py target/release/aishe
