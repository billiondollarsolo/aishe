name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  msrv:
    name: MSRV (1.88) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.88
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Build on 1.88
        run: cargo build --verbose

  pty-smoke:
    name: PTY smoke tests (zsh-pty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build release binary
        run: cargo build --release

      - name: Drive real zsh through the PTY front-end
        run: python3 tests/pty_smoke.py target/release/aishe

      - name: zsh-PTY scenario tests (NL routing, sigils, auto-mode, history)
        run: python3 tests/pty_scenarios.py target/release/aishe

      - name: zsh-PTY fuzz (generated commands, sigil NL, adversarial responses)
        run: python3 tests/pty_fuzz.py target/release/aishe

      - name: zsh feature matrix (pipes, here-docs, loops, jobs, history, ...)
        run: python3 tests/zsh_features.py target/release/aishe

      - name: zsh-PTY signals (Ctrl-C, Ctrl-Z, resize, multi-line)
        run: python3 tests/pty_signals.py target/release/aishe

      - name: Real-model classification (opt-in; skips without the secret)
        env:
          AISHE_REALTEST_KEY: ${{ secrets.AISHE_REALTEST_KEY }}
        run: python3 tests/real_model.py target/release/aishe
      - name: Real-model robustness fuzz (opt-in; skips without the secret)
        env:
          AISHE_REALTEST_KEY: ${{ secrets.AISHE_REALTEST_KEY }}
        run: python3 tests/real_fuzz.py target/release/aishe
      - name: Admin validation (shell pass-through + file ops; NL skipped w/o key)
        run: python3 tests/admin_validation.py target/release/aishe
