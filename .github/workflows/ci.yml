name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  pty-smoke:
    name: PTY smoke tests (zsh-pty + reedline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build release binary
        run: cargo build --release

      - name: Drive real zsh through the PTY front-end
        run: python3 tests/pty_smoke.py target/release/aishe

      - name: zsh-PTY scenario tests (NL routing, sigils, auto-mode, history)
        run: python3 tests/pty_scenarios.py target/release/aishe

      - name: zsh-PTY fuzz (generated commands, sigil NL, adversarial responses)
        run: python3 tests/pty_fuzz.py target/release/aishe

      - name: Drive the reedline front-end through a PTY
        run: python3 tests/reedline_smoke.py target/release/aishe

      - name: Admin validation (shell pass-through + file ops; NL skipped w/o key)
        run: python3 tests/admin_validation.py target/release/aishe
