name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: documentation lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require lifecycle labels and index entries
        shell: bash
        run: |
          failed=0
          for document in docs/design/*.md; do
            if ! head -n 30 "$document" | grep -Eq '^> \*\*Lifecycle: (Active|Implemented|Superseded|Historical|Validation evidence)\.\*\*'; then
              echo "Missing recognized lifecycle label: $document" >&2
              failed=1
            fi

            filename="${document##*/}"
            if ! grep -Fq "[$filename]($filename)" docs/design/README.md; then
              echo "Missing from docs/design/README.md: $document" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Check internal documentation links and anchors
        run: python3 tests/require_gate.py python3 tests/docs_contract_test.py

  supply-chain:
    name: dependency advisories, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      AISHE_LEAN: "1"
      AISHE_LEGACY_OPENCODE: "0"
      AISHE_ZSH_PROFILE: clean
    steps:
      - uses: actions/checkout@v7

      - name: Isolate the managed runtime
        shell: bash
        run: echo "AISHE_RUNTIME_DIR=$RUNNER_TEMP/aishe-runtime" >> "$GITHUB_ENV"

      # aishe wraps a real zsh, so `aishe doctor` reports a failed check and
      # exits non-zero without it. macOS runners ship zsh; ubuntu does not, so
      # the cli tests that assert `doctor` succeeds failed only there.
      - name: Install zsh (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zsh bubblewrap shellcheck
          # Match pty-smoke: group-writable zsh dirs make compinit interactive.
          sudo chmod -R go-w /usr/share/zsh /usr/local/share/zsh 2>/dev/null || true

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      # Group-writable zsh dirs make stock `compinit` interactive; lean hook
      # now passes `-u`, but harden the image too (mirrors the ubuntu step).
      - name: Harden zsh dirs (macOS)
        if: runner.os == 'macOS'
        run: sudo chmod -R go-w /usr/share/zsh /usr/local/share/zsh 2>/dev/null || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build without default features
        run: cargo check --no-default-features --locked

      - name: Build
        run: cargo build --verbose --locked

      - name: Shellcheck and generated hook syntax
        run: python3 tests/require_gate.py python3 tests/shell_contract.py target/debug/aishe

      - name: Qualification reporting contract
        run: python3 tests/require_gate.py python3 tests/qualify_test.py

      - name: Test
        # Bound the step so a nested-PTY deadlock cannot burn ~15m then cancel.
        timeout-minutes: 10
        run: cargo test --all-targets --verbose --locked

      - name: Installer transaction and fault contract
        run: sh tests/installer_runtime_transaction.sh

  msrv:
    name: MSRV (1.88) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.88 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.88
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
      - name: Build on 1.88
        run: cargo build --verbose --locked

  pty-native:
    name: Native shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      AISHE_LEAN: "1"
      AISHE_LEGACY_OPENCODE: "0"
      AISHE_ZSH_PROFILE: clean
    steps:
      - uses: actions/checkout@v7

      - name: Isolate runtime state
        shell: bash
        run: echo "AISHE_RUNTIME_DIR=$RUNNER_TEMP/aishe-native-runtime" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install shell tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zsh bubblewrap tmux screen
          sudo chmod -R go-w /usr/share/zsh /usr/local/share/zsh 2>/dev/null || true

      - name: Harden zsh directories (macOS)
        if: runner.os == 'macOS'
        run: sudo chmod -R go-w /usr/share/zsh /usr/local/share/zsh 2>/dev/null || true

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Build release binary
        timeout-minutes: 10
        run: cargo build --release --locked

      - name: Direct commands stay local and meet the startup SLO
        id: direct_shell_benchmark
        # Preserve a failed performance result while still collecting the
        # terminal regressions below. The final step enforces this outcome.
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          python3 tests/require_gate.py python3 tests/direct_shell_benchmark.py target/release/aishe
          --commands 100 --warmup 10

      - name: Native display, mode grants, and cancellation
        timeout-minutes: 5
        run: |
          python3 tests/require_gate.py python3 tests/lean_ui_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/lean_modes_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/lean_cancel_pty.py target/release/aishe

      - name: Slash discovery and concurrent picker isolation
        timeout-minutes: 5
        run: |
          python3 tests/require_gate.py python3 tests/lean_slash_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/lean_picker_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/picker_arrows_pty.py target/release/aishe

      - name: Setup, settings, and terminal restoration
        timeout-minutes: 8
        run: |
          python3 tests/require_gate.py python3 tests/setup_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/settings_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/in_shell_menus_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/prompt_primitives_pty.py target/release/aishe

      - name: Native personal profile preserves zsh customizations
        timeout-minutes: 5
        run: python3 tests/require_gate.py python3 tests/native_zsh_profile_pty.py target/release/aishe

      - name: Native agents use the live shell environment
        timeout-minutes: 5
        run: python3 tests/require_gate.py python3 tests/live_shell_state_pty.py target/release/aishe

      - name: Quiet background work and task browser
        timeout-minutes: 5
        run: python3 tests/require_gate.py python3 tests/background_tasks_pty.py target/release/aishe

      - name: Background questions, approvals, steering, and recorded checks
        timeout-minutes: 10
        run: |
          python3 tests/require_gate.py python3 tests/native_task_interactions.py target/release/aishe
          python3 tests/require_gate.py python3 tests/task_interactions_pty.py target/release/aishe

      - name: Clean and personal zsh feature matrices
        timeout-minutes: 5
        run: |
          python3 tests/require_gate.py python3 tests/zsh_features.py target/release/aishe --profile clean
          python3 tests/require_gate.py python3 tests/zsh_features.py target/release/aishe --profile personal

      - name: Clean and personal jobs, signals, paste, editing, and terminal restore
        timeout-minutes: 5
        run: |
          python3 tests/require_gate.py python3 tests/pty_signals.py target/release/aishe --profile clean
          python3 tests/require_gate.py python3 tests/pty_signals.py target/release/aishe --profile personal

      - name: Terminal latency and resize
        timeout-minutes: 4
        run: |
          python3 tests/require_gate.py python3 tests/terminal_compat_test.py
          python3 tests/require_gate.py python3 tests/terminal_compat.py target/release/aishe \
            --capability local-latency --require-capability local-latency \
            --json test-results/terminal-compat-native-${{ runner.os }}.json

      - name: Native tmux and GNU screen transports
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: >-
          python3 tests/require_gate.py python3 tests/terminal_compat.py target/release/aishe
          --capability tmux --require-capability tmux
          --capability screen --require-capability screen
          --json test-results/terminal-compat-native-multiplexers.json

      - name: CLI, local provider, and credential contracts
        timeout-minutes: 5
        run: |
          python3 tests/require_gate.py python3 tests/docs_cli_block_test.py target/release/aishe
          python3 tests/require_gate.py python3 tests/provider_unauthenticated.py target/release/aishe
          python3 tests/require_gate.py python3 tests/live_contract_test.py
          python3 tests/require_gate.py python3 tests/harness_identity_test.py

      - name: Private shared credentials (Linux)
        if: runner.os == 'Linux'
        run: python3 tests/require_gate.py python3 tests/credentials_linux.py target/release/aishe

      - name: Native Bash declared-tier matrix
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          python3 tests/require_gate.py python3 tests/bash_hook_test.py
          python3 tests/require_gate.py python3 tests/bash_hook.py target/release/aishe \
            --bash /bin/bash --require-family 5.x

      - name: Durable native task interruption and resume
        timeout-minutes: 5
        run: |
          python3 tests/require_gate.py python3 tests/native_background_lifecycle.py target/release/aishe
          python3 tests/require_gate.py python3 tests/durable_task_resume.py target/release/aishe

      - name: Upload terminal qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-terminal-evidence-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore

      - name: Enforce direct shell startup SLO
        if: always() && steps.direct_shell_benchmark.outcome == 'failure'
        run: |
          echo "Direct shell startup qualification failed; see its recorded benchmark." >&2
          exit 1

  pty-legacy:
    name: Explicit legacy shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      AISHE_LEAN: "0"
      AISHE_LEGACY_OPENCODE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Isolate managed runtime state
        shell: bash
        run: echo "AISHE_RUNTIME_DIR=$RUNNER_TEMP/aishe-legacy-runtime" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install zsh and isolation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zsh bubblewrap
          sudo chmod -R go-w /usr/share/zsh /usr/local/share/zsh 2>/dev/null || true

      - name: Harden zsh directories (macOS)
        if: runner.os == 'macOS'
        run: sudo chmod -R go-w /usr/share/zsh /usr/local/share/zsh 2>/dev/null || true

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}

      - name: Build release binary
        timeout-minutes: 10
        run: cargo build --release --locked

      - name: Install and live-verify pinned OpenCode runtime
        timeout-minutes: 5
        run: |
          target/release/aishe backend install
          target/release/aishe backend verify --live

      - name: Historical zsh UX executes under an explicit legacy gate
        timeout-minutes: 8
        run: |
          python3 tests/require_gate.py python3 tests/pty_smoke.py target/release/aishe
          python3 tests/require_gate.py python3 tests/pty_scenarios.py target/release/aishe
          python3 tests/require_gate.py python3 tests/statusline_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/model_picker_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/pty_signals.py target/release/aishe --profile legacy

      - name: Historical customization and menu regressions (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          python3 tests/require_gate.py python3 tests/in_shell_menus_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/yolo_consent_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/palette_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/mode_handoff_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/bare_words_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/theme_prompt_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/keys_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/usage_report_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/slash_highlight_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/picker_arrows_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/statusline_width_pty.py target/release/aishe
          python3 tests/require_gate.py python3 tests/zsh_features.py target/release/aishe --profile legacy

      - name: Historical adversarial routing fuzz (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: python3 tests/require_gate.py python3 tests/pty_fuzz.py target/release/aishe

      - name: Upload terminal qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: legacy-terminal-evidence-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore

  managed-runtime:
    name: Managed OpenCode runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AISHE_LEAN: "0"
      AISHE_LEGACY_OPENCODE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Isolate managed runtime state
        run: echo "AISHE_RUNTIME_DIR=$RUNNER_TEMP/aishe-managed-runtime" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install shell and isolation tools
        run: |
          sudo apt-get update && sudo apt-get install -y zsh bubblewrap
          sudo chmod -R go-w /usr/share/zsh /usr/local/share/zsh 2>/dev/null || true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
      - name: Build release binary
        timeout-minutes: 10
        run: cargo build --release --locked
      - name: Install and live-verify pinned runtime
        timeout-minutes: 5
        run: |
          target/release/aishe backend install
          target/release/aishe backend verify --live
      - name: Runtime, credential, and host-scope contracts
        timeout-minutes: 10
        run: |
          python3 tests/require_gate.py python3 tests/opencode_runtime_contract.py target/release/aishe
          python3 tests/require_gate.py python3 tests/opencode_connection_isolation.py target/release/aishe
          python3 tests/require_gate.py python3 tests/opencode_host_scope.py target/release/aishe
      - name: Runtime reconnect and concurrent-session qualification
        timeout-minutes: 8
        run: |
          python3 tests/require_gate.py python3 tests/opencode_soak.py target/release/aishe \
            --turns 20 --cold-cycles 3 --warm-probes 20 --reconnect-every 10
          python3 tests/require_gate.py python3 tests/opencode_concurrency.py target/release/aishe --sessions 8
      - name: Installer upgrade preserves config and data
        run: sh tests/installer_upgrade.sh target/release/aishe
      - name: Admin and shell contracts
        timeout-minutes: 5
        run: python3 tests/require_gate.py python3 tests/admin_validation.py target/release/aishe
      - name: Live model contracts (opt-in)
        env:
          AISHE_REALTEST_KEY: ${{ secrets.AISHE_REALTEST_KEY }}
          AISHE_REALTEST_BASE_URL: https://api.openai.com
          AISHE_REALTEST_MODEL: gpt-5.6-luna
        run: |
          python3 tests/real_model.py target/release/aishe
          python3 tests/real_fuzz.py target/release/aishe
