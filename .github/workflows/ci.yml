name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # aishe wraps a real zsh, so `aishe doctor` reports a failed check and
      # exits non-zero without it. macOS runners ship zsh; ubuntu does not, so
      # the cli tests that assert `doctor` succeeds failed only there.
      - name: Install zsh (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  msrv:
    name: MSRV (1.88) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.88
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Build on 1.88
        run: cargo build --verbose

  pty-smoke:
    name: PTY smoke tests (zsh-pty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install zsh
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          # GitHub images leave the zsh completion directories group-writable,
          # so compinit stops with an interactive "insecure directories …
          # continue [y] or abort [n]?" prompt. Inside a PTY test that prompt
          # eats a keystroke and every later expect() reads a line behind.
          # ZSH_DISABLE_COMPFIX does not help — it is an oh-my-zsh variable,
          # not something native compinit consults.
          sudo chmod -R go-w /usr/share/zsh /usr/local/share/zsh 2>/dev/null || true
          zsh -f -c 'autoload -Uz compaudit && compaudit' || echo "compaudit clean"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build release binary
        run: cargo build --release

      - name: Drive real zsh through the PTY front-end
        run: python3 tests/pty_smoke.py target/release/aishe

      - name: zsh-PTY scenario tests (NL routing, sigils, auto-mode, history)
        run: python3 tests/pty_scenarios.py target/release/aishe

      - name: zsh-PTY fuzz (generated commands, sigil NL, adversarial responses)
        run: python3 tests/pty_fuzz.py target/release/aishe

      - name: zsh feature matrix (pipes, here-docs, loops, jobs, history, ...)
        run: python3 tests/zsh_features.py target/release/aishe

      - name: zsh-PTY signals (Ctrl-C, Ctrl-Z, resize, multi-line)
        run: python3 tests/pty_signals.py target/release/aishe

      - name: Real-model classification (opt-in; skips without the secret)
        env:
          AISHE_REALTEST_KEY: ${{ secrets.AISHE_REALTEST_KEY }}
        run: python3 tests/real_model.py target/release/aishe
      - name: Real-model robustness fuzz (opt-in; skips without the secret)
        env:
          AISHE_REALTEST_KEY: ${{ secrets.AISHE_REALTEST_KEY }}
        run: python3 tests/real_fuzz.py target/release/aishe
      - name: Admin validation (shell pass-through + file ops; NL skipped w/o key)
        run: python3 tests/admin_validation.py target/release/aishe
