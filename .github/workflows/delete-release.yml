name: Delete release

# Manual maintenance: delete a GitHub release and its git tag. Runs on GitHub
# (via the GITHUB_TOKEN), so it is not subject to local tag-push restrictions.
# Use with care; this removes published artifacts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to delete (also deletes the git tag), e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release(s) and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          repo="${{ github.repository }}"
          echo "Cleaning up release(s) tagged $tag in $repo"
          # Delete EVERY release object whose tag_name matches, by id. This also
          # catches duplicate or draft releases (e.g. left by a creation race),
          # which a plain `gh release delete <tag>` would miss.
          ids=$(gh api --paginate "repos/$repo/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id")
          if [ -z "$ids" ]; then
            echo "No releases found for $tag."
          else
            for id in $ids; do
              echo "Deleting release id $id"
              gh api -X DELETE "repos/$repo/releases/$id"
            done
          fi
          # Delete the git tag ref if it still exists (404 is fine).
          gh api -X DELETE "repos/$repo/git/refs/tags/$tag" \
            && echo "Deleted tag $tag" || echo "Tag $tag not present."
