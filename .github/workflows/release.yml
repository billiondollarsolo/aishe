name: Release

on:
  push:
    tags: ["v*"]
  # Allow cutting a release without pushing a tag (the create_release job makes
  # the tag from this input). Useful where tag pushes are restricted.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.1)"
        required: true
        default: "0.1.1"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create (or reuse) the release and tag ONCE, before any uploads. Doing this in
  # a single upstream job avoids the race where multiple concurrent build jobs
  # each try to create the same release and end up with a duplicate/draft.
  create_release:
    name: create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version and tag
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$REQUESTED_VERSION"
          else
            v="${REF_NAME#v}"
          fi
          manifest_version="$(
            awk '
              $0 == "[package]" { in_package=1; next }
              in_package && /^\[/ { exit }
              in_package && /^version[[:space:]]*=/ {
                value=$0
                sub(/^[^"]*"/, "", value)
                sub(/".*$/, "", value)
                print value
                exit
              }
            ' Cargo.toml
          )"
          if [ -z "$v" ] || [ "$v" != "$manifest_version" ]; then
            echo "release version '$v' does not match Cargo.toml '$manifest_version'" >&2
            exit 1
          fi
          if ! grep -F "## [$v]" CHANGELOG.md >/dev/null; then
            echo "CHANGELOG.md has no release heading for $v" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Create the draft release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: true
          append_body: false
          body: |
            aishe ${{ steps.ver.outputs.tag }}

            Prebuilt binaries (Linux x86_64/aarch64 in gnu and static musl;
            macOS arm64/x86_64) and Linux packages (.deb / .rpm for amd64 and
            arm64) are attached below, each with a .sha256 checksum.

            Install guide: https://github.com/billiondollarsolo/aishe/blob/main/docs/installation.md
            Changelog: https://github.com/billiondollarsolo/aishe/blob/main/CHANGELOG.md

  build:
    name: build ${{ matrix.target }}
    needs: create_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: built with cargo-zigbuild so musl/aarch64 cross-compile
          # cleanly from a single ubuntu runner (zig provides the C toolchain).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: zig
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: zig
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: zig
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: zig
          # macOS: native builds on the macOS runner.
          - os: macos-latest
            target: aarch64-apple-darwin
            builder: native
          - os: macos-latest
            target: x86_64-apple-darwin
            builder: native
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Zig
        if: matrix.builder == 'zig'
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zig'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary (zig cross)
        if: matrix.builder == 'zig'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Build release binary (native)
        if: matrix.builder == 'native'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball + checksum
        run: |
          bindir="target/${{ matrix.target }}/release"
          tarball="aishe-${{ matrix.target }}.tar.gz"
          tar -czf "$tarball" -C "$bindir" aishe
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$tarball" > "$tarball.sha256"
          else
            shasum -a 256 "$tarball" > "$tarball.sha256"
          fi

      # Stash the raw Linux gnu binaries so the packaging job can turn them into
      # .deb/.rpm without rebuilding.
      - name: Stage Linux binary for packaging
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/aishe
          retention-days: 1

      # The release already exists (create_release), so this only uploads assets.
      - name: Upload tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create_release.outputs.tag }}
          files: |
            aishe-${{ matrix.target }}.tar.gz
            aishe-${{ matrix.target }}.tar.gz.sha256

  package:
    name: linux packages (.deb / .rpm)
    needs: [create_release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: bin-x86_64-unknown-linux-gnu
          path: dist/amd64

      - name: Download aarch64 binary
        uses: actions/download-artifact@v8
        with:
          name: bin-aarch64-unknown-linux-gnu
          path: dist/arm64

      - name: Generate completions and man page
        run: |
          chmod +x dist/amd64/aishe dist/arm64/aishe
          mkdir -p dist/completions dist/man
          # Completions and the man page are arch-independent, so generate them
          # once from the (native) amd64 binary. The man page is emitted natively
          # by `aishe man` (clap_mangen) — no help2man dependency.
          dist/amd64/aishe completions bash > dist/completions/aishe.bash
          dist/amd64/aishe completions zsh  > dist/completions/_aishe
          dist/amd64/aishe completions fish > dist/completions/aishe.fish
          dist/amd64/aishe man > dist/man/aishe.1
          gzip -9 -n -f dist/man/aishe.1

      - name: Install nfpm
        run: |
          # Official nfpm apt repo (nfpm is a Go tool, not a cargo crate, so the
          # generic install actions do not carry it).
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build .deb and .rpm packages
        run: |
          sudo apt-get install -y gettext-base   # provides envsubst
          version="${{ needs.create_release.outputs.version }}"
          for arch in amd64 arm64; do
            # Render a concrete config per arch (nfpm does not reliably expand
            # ${...} env vars in the contents.src field).
            VERSION="$version" ARCH="$arch" BINARY="dist/$arch/aishe" \
              envsubst '${VERSION} ${ARCH} ${BINARY}' < nfpm.yaml > "nfpm.$arch.yaml"
            for pkger in deb rpm; do
              nfpm package --config "nfpm.$arch.yaml" --packager "$pkger" --target dist/
            done
          done
          ( cd dist && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done )
          ls -l dist/*.deb dist/*.rpm

      - name: Upload packages to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create_release.outputs.tag }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.deb.sha256
            dist/*.rpm.sha256

  publish:
    name: publish complete release
    needs: [create_release, build, package]
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after every artifact is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create_release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
